name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q tools tests

      - name: Ruff lint
        run: ruff check tools tests

      - name: Ruff format check
        run: ruff format --check tools tests

      - name: Run tests
        run: pytest -q

      - name: Validate templates
        run: python tools/validate_templates.py

      - name: Validate bilingual documentation
        run: python tools/validate_docs.py


  zabbix-import:
    name: Zabbix 7.0 fresh import
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Start disposable Zabbix 7.0 stack
        shell: bash
        run: |
          set -euo pipefail
          docker network create zabbix-ci
          docker run -d --name zabbix-db --network zabbix-ci \
            -e POSTGRES_DB=zabbix \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            postgres:16-alpine

          for i in $(seq 1 60); do
            if docker exec zabbix-db pg_isready -U zabbix -d zabbix >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec zabbix-db pg_isready -U zabbix -d zabbix

          docker run -d --name zabbix-server --network zabbix-ci \
            -e DB_SERVER_HOST=zabbix-db \
            -e POSTGRES_DB=zabbix \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            zabbix/zabbix-server-pgsql:alpine-7.0-latest

          docker run -d --name zabbix-web --network zabbix-ci -p 8080:8080 \
            -e DB_SERVER_HOST=zabbix-db \
            -e POSTGRES_DB=zabbix \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            -e ZBX_SERVER_HOST=zabbix-server \
            -e ZBX_SERVER_NAME="ISC BIND template CI" \
            zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest

      - name: Import and verify template
        run: >
          python tools/zabbix_api_import_test.py
          --template templates/7.0/isc-bind9-by-zabbix-agent.yaml
          --wait 300

      - name: Container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker ps -a || true
          docker logs zabbix-db || true
          docker logs zabbix-server || true
          docker logs zabbix-web || true


  zabbix-8-import:
    name: Zabbix 8.0 trunk fresh import
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Start disposable Zabbix 8.0 trunk stack
        shell: bash
        run: |
          set -euo pipefail
          docker network create zabbix8-ci
          docker run -d --name zabbix8-db --network zabbix8-ci \
            -e POSTGRES_DB=zabbix \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            postgres:16-alpine

          for i in $(seq 1 60); do
            if docker exec zabbix8-db pg_isready -U zabbix -d zabbix >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec zabbix8-db pg_isready -U zabbix -d zabbix

          docker run -d --name zabbix8-server --network zabbix8-ci \
            -e DB_SERVER_HOST=zabbix8-db \
            -e POSTGRES_DB=zabbix \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            zabbix/zabbix-server-pgsql:trunk-alpine

          docker run -d --name zabbix8-web --network zabbix8-ci -p 8081:8080 \
            -e DB_SERVER_HOST=zabbix8-db \
            -e POSTGRES_DB=zabbix \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            -e ZBX_SERVER_HOST=zabbix8-server \
            -e ZBX_SERVER_NAME="ISC BIND template CI 8.0" \
            zabbix/zabbix-web-nginx-pgsql:trunk-alpine

      - name: Import and verify template
        run: >
          python tools/zabbix_api_import_test.py
          --url http://127.0.0.1:8081/api_jsonrpc.php
          --template templates/8.0/isc-bind9-by-zabbix-agent.yaml
          --wait 360

      - name: Container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker ps -a || true
          docker logs zabbix8-db || true
          docker logs zabbix8-server || true
          docker logs zabbix8-web || true


  bind-runtime-contract:
    name: BIND ${{ matrix.bind-version }} live JSON contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bind-version:
          - "9.18"
          - "9.20"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create minimal BIND configuration
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/named.conf" <<'EOF'
          options {
              directory "/var/cache/bind";
              listen-on { any; };
              listen-on-v6 { none; };
              recursion yes;
              allow-query { any; };
          };

          statistics-channels {
              inet 0.0.0.0 port 8053 allow { any; };
          };
          EOF

      - name: Start official ISC BIND
        shell: bash
        run: |
          docker run -d --name bind-ci \
            -p 127.0.0.1:18053:8053 \
            -v "${RUNNER_TEMP}/named.conf:/etc/bind/named.conf:ro" \
            internetsystemsconsortium/bind9:${{ matrix.bind-version }}

      - name: Validate live statistics-channel JSON
        run: >
          python tools/check_bind_runtime.py
          --version ${{ matrix.bind-version }}
          --wait 120

      - name: Validate classic Zabbix agent keys
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="zabbix/zabbix-agent:alpine-7.0-latest"
          docker pull "$IMAGE"
          docker run --rm --network container:bind-ci \
            --entrypoint /usr/sbin/zabbix_agentd "$IMAGE" \
            -t 'web.page.get[127.0.0.1,/json/v1/status,8053]' | grep -q '200 OK'
          docker run --rm --network container:bind-ci \
            --entrypoint /usr/sbin/zabbix_agentd "$IMAGE" \
            -t 'net.dns[127.0.0.1,localhost,A,1,2,udp]' | grep -Eq '\[u\|1\]'
          docker run --rm --network container:bind-ci \
            --entrypoint /usr/sbin/zabbix_agentd "$IMAGE" \
            -t 'net.dns[127.0.0.1,localhost,A,1,2,tcp]' | grep -Eq '\[u\|1\]'

      - name: Validate Zabbix agent 2 keys
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="zabbix/zabbix-agent2:alpine-7.0-latest"
          docker pull "$IMAGE"

          OUT=$(docker run --rm --network container:bind-ci \
            --entrypoint /usr/sbin/zabbix_agent2 "$IMAGE" \
            -t 'web.page.get[127.0.0.1,/json/v1/status,8053]')
          printf '%s\n' "$OUT"
          grep -q '200 OK' <<<"$OUT"

          OUT=$(docker run --rm --network container:bind-ci \
            --entrypoint /usr/sbin/zabbix_agent2 "$IMAGE" \
            -t 'net.dns[127.0.0.1,localhost,A,1,2,udp]')
          printf '%s\n' "$OUT"
          grep -Eq '\[[[:alpha:]]+\|1\]' <<<"$OUT"

          OUT=$(docker run --rm --network container:bind-ci \
            --entrypoint /usr/sbin/zabbix_agent2 "$IMAGE" \
            -t 'net.dns[127.0.0.1,localhost,A,1,2,tcp]')
          printf '%s\n' "$OUT"
          grep -Eq '\[[[:alpha:]]+\|1\]' <<<"$OUT"

      - name: Container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker ps -a || true
          docker logs bind-ci || true
