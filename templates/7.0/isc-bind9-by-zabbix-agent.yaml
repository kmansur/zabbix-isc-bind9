            - uuid: a81c3d9d119a4f23a8890a0000000007
              name: 'BIND cache [{#BIND.VIEW}]: Hit ratio'
              type: DEPENDENT
              key: 'bind.cache.hitratio[{#BIND.VIEW}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var view = "{#BIND.VIEW}";
                      var resolver = d.views && d.views[view] ? d.views[view].resolver : null;
                      var c = resolver ? resolver.cachestats : null;
                      if (!c) {
                          throw "BIND cache statistics not available";
                      }
                      var hits = Number(c.CacheHits) || 0;
                      var misses = Number(c.CacheMisses) || 0;
                      var total = hits + misses;
                      if (total === 0) {
                          return 0;
                      }
                      return (hits * 100) / total;
              master_item:
                key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
              tags:
                - tag: component
                  value: cache
                - tag: bind-view
                  value: '{#BIND.VIEW}'
