                - sortorder: '1'
                  color: F7941D
                  item:
                    host: 'ISC BIND by Zabbix agent'
                    key: 'bind.cache.nsecnodes[{#BIND.VIEW}]'
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var views = d.views || {};
                  var out = [];
