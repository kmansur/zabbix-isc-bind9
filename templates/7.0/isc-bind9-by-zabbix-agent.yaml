      macros:
        - macro: '{$BIND.DNS.TEST.ENABLED}'
          value: '0'
          description: 'Enable functional DNS alerting after choosing a valid test name for this BIND instance. Set to 1 after validation.'
        - macro: '{$BIND.DNS.TEST.INTERVAL}'
          value: 30s
          description: 'Polling interval for the native UDP/TCP DNS availability and response-time checks.'
        - macro: '{$BIND.DNS.PORT}'
          value: '53'
          description: 'Local DNS service port used by the TCP/UDP listener checks.'
        - macro: '{$BIND.PROCESS.NAME}'
          value: named
          description: 'Process name used by proc.num[] for an independent named daemon health check.'
        - macro: '{$BIND.DNS.TEST.SERVER}'
          value: '127.0.0.1'
          description: 'DNS server address used by the native Zabbix DNS health checks.'
        - macro: '{$BIND.DNS.TEST.NAME}'
          value: localhost
          description: 'DNS name used for service availability and response-time checks. Configure a stable name served by this BIND instance before enabling DNS functional alerts.'
        - macro: '{$BIND.DNS.TEST.TYPE}'
          value: A
          description: 'DNS record type used by the native service health checks.'
        - macro: '{$BIND.DNS.TEST.TIMEOUT}'
          value: '1'
          description: 'Per-attempt DNS query timeout in seconds.'
        - macro: '{$BIND.DNS.TEST.COUNT}'
          value: '2'
          description: 'Number of DNS query attempts performed by the native Zabbix agent key.'
        - macro: '{$BIND.DNS.FAIL.WINDOW}'
          value: 3m
          description: 'Continuous failure window before UDP or TCP DNS availability raises a problem.'
        - macro: '{$BIND.DNS.RESPONSE.UDP.WARN}'
          value: '0.1'
          description: 'Average UDP DNS response-time warning threshold in seconds.'
        - macro: '{$BIND.DNS.RESPONSE.TCP.WARN}'
          value: '0.1'
          description: 'Average TCP DNS response-time warning threshold in seconds.'
        - macro: '{$BIND.QRYDROPPED.RATE.WARN}'
          value: '0'
          description: 'Average dropped-query rate above this value for 5 minutes raises a warning.'
        - macro: '{$BIND.SERVFAIL.RATE.WARN}'
          value: '5'
          description: 'Average SERVFAIL rate above this value for 5 minutes raises a warning.'
        - macro: '{$BIND.ZONE.EXPIRES.WARN}'
          value: 1h
          description: 'Warn when a secondary zone is less than this interval away from its SOA expiry deadline.'
        - macro: '{$BIND.ZONE.SECONDARY.MATCHES}'
          value: '^$'
          description: 'Regex of secondary zone names for per-zone refresh/expiry discovery. Default matches no zones; use .* to enable all secondary zones.'
        - macro: '{$BIND.ZONE.DNSSEC.MATCHES}'
          value: '^$'
          description: 'Regex of zone names for per-zone DNSSEC counter discovery. Default matches no zones; use .* to enable all zones.'
        - macro: '{$BIND.VIEW.MATCHES}'
          value: '.*'
          description: 'Regex of BIND view names eligible for view-based low-level discovery.'
        - macro: '{$BIND.VIEW.NOT_MATCHES}'
          value: '^_bind$'
          description: 'Regex of BIND view names excluded from view-based low-level discovery.'
        - macro: '{$BIND.RECURSCLIENTS.WARN}'
          value: '0'
          description: 'Recursive-client warning threshold. Set to a positive value to enable the saturation trigger; 0 disables it.'
        - macro: '{$BIND.CACHE.DELETELRU.WARN}'
          value: '0'
          description: 'Sustained DeleteLRU rate threshold over 10 minutes. Set to a positive value to enable the trigger; 0 disables it.'
        - macro: '{$BIND.STATS.HOST}'
          value: '127.0.0.1'
          description: 'Host portion used by web.page.get[]. Keep the statistics channel on loopback whenever possible.'
        - macro: '{$BIND.STATS.NODATA}'
          value: 10m
          description: 'Maximum interval without status statistics before declaring the statistics channel unavailable.'
        - macro: '{$BIND.STATS.PORT}'
          value: '8053'
