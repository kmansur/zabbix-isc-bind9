zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 09692d9c015440aab7aa667a9639ebc8
      name: Templates/Applications
  templates:
    - uuid: e381e5bdc51445fd9bbe1b1e8ea1eb0d
      template: 'ISC BIND by Zabbix agent'
      name: 'ISC BIND by Zabbix agent'
      description: |
        Security-focused monitoring of ISC BIND through the native HTTP statistics channel.

        Compatible with Zabbix Agent and Zabbix Agent 2. The template intentionally uses standard passive agent checks and
        standard agent keys and does not require Agent 2 plugins, UserParameter, privileged
        commands, rndc, curl, jq, or external scripts.

        Recommended statistics listener:
        statistics-channels {
            inet 127.0.0.1 port 8053 allow { 127.0.0.1; };
        };

        Project: https://github.com/kmansur/zabbix-isc-bind9
        License: MIT. See LICENSE and NOTICE.md.
        Exports are maintained for Zabbix 7.0 and 8.0.
      vendor:
        name: Net Tech
        version: 1.1-0
      groups:
        - name: Templates/Applications
      items:
        - uuid: fc1ced7cb7114269b89a8e99c52cffc9
          name: 'BIND: Statistics status raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/status","{$BIND.STATS.PORT}"]'
          delay: 30s
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw
        - uuid: 5fb194ee3c944cb99e13a0d58d98b836
          name: 'BIND: Statistics channel heartbeat'
          type: DEPENDENT
          key: bind.stats.heartbeat
          delay: '0'
          history: 7d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return 1;'
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/status","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: internal
            - tag: scope
              value: availability
          triggers:
            - uuid: d48429e64c854d9b99cfb8aaba9fee7e
              expression: 'nodata(/ISC BIND by Zabbix agent/bind.stats.heartbeat,{$BIND.STATS.NODATA})=1'
              name: 'BIND: Statistics channel is unavailable'
              priority: WARNING
              description: 'No heartbeat has been derived from the local BIND statistics channel within the configured interval. This indicates monitoring degradation; DNS service availability is checked independently.'
              tags:
                - tag: scope
                  value: availability
        - uuid: a81c3d9d119a4f23a8890a0000000001
          name: 'BIND: named processes'
          key: 'proc.num[{$BIND.PROCESS.NAME}]'
          delay: 30s
          history: 30d
          tags:
            - tag: component
              value: service
            - tag: scope
              value: availability
          triggers:
            - uuid: a81c3d9d119a4f23a8890a0000000011
              expression: 'max(/ISC BIND by Zabbix agent/proc.num[{$BIND.PROCESS.NAME}],3m)=0'
              name: 'BIND: named process is not running'
              priority: HIGH
              description: 'No process matching {$BIND.PROCESS.NAME} has been detected for three minutes. This check is independent of the BIND statistics channel.'
              tags:
                - tag: scope
                  value: availability
        - uuid: a81c3d9d119a4f23a8890a0000000002
          name: 'BIND: TCP listener state'
          key: 'net.tcp.listen[{$BIND.DNS.PORT}]'
          delay: 30s
          history: 30d
          valuemap:
            name: 'BIND service state'
          tags:
            - tag: component
              value: service
            - tag: scope
              value: availability
          triggers:
            - uuid: a81c3d9d119a4f23a8890a0000000012
              expression: 'max(/ISC BIND by Zabbix agent/net.tcp.listen[{$BIND.DNS.PORT}],3m)=0'
              name: 'BIND: TCP DNS listener is unavailable'
              priority: HIGH
              description: 'The local TCP DNS listener on port {$BIND.DNS.PORT} has not been detected for three minutes.'
              dependencies:
                - name: 'BIND: named process is not running'
                  expression: 'max(/ISC BIND by Zabbix agent/proc.num[{$BIND.PROCESS.NAME}],3m)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: a81c3d9d119a4f23a8890a0000000003
          name: 'BIND: UDP listener state'
          key: 'net.udp.listen[{$BIND.DNS.PORT}]'
          delay: 30s
          history: 30d
          valuemap:
            name: 'BIND service state'
          tags:
            - tag: component
              value: service
            - tag: scope
              value: availability
          triggers:
            - uuid: a81c3d9d119a4f23a8890a0000000013
              expression: 'max(/ISC BIND by Zabbix agent/net.udp.listen[{$BIND.DNS.PORT}],3m)=0'
              name: 'BIND: UDP DNS listener is unavailable'
              priority: HIGH
              description: 'The local UDP DNS listener on port {$BIND.DNS.PORT} has not been detected for three minutes.'
              dependencies:
                - name: 'BIND: named process is not running'
                  expression: 'max(/ISC BIND by Zabbix agent/proc.num[{$BIND.PROCESS.NAME}],3m)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 9c65ecaa51804a66922a6296d6bc1bb1
          name: 'BIND: DNS UDP availability'
          key: 'net.dns[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},udp]'
          delay: '{$BIND.DNS.TEST.INTERVAL}'
          history: 30d
          valuemap:
            name: 'BIND service state'
          tags:
            - tag: component
              value: dns
            - tag: scope
              value: availability
          triggers:
            - uuid: c52ae7683e0540ebbb851f7f5e107c0f
              expression: '{$BIND.DNS.TEST.ENABLED}=1 and max(/ISC BIND by Zabbix agent/net.dns[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},udp],{$BIND.DNS.FAIL.WINDOW})=0'
              name: 'BIND: DNS functional test failed over UDP'
              event_name: 'BIND: DNS functional test failed over UDP ({$BIND.DNS.TEST.NAME}/{$BIND.DNS.TEST.TYPE})'
              priority: HIGH
              description: 'The configured functional DNS query did not produce a usable UDP answer during the failure window. This does not by itself prove that the BIND daemon is down; verify that the configured test name is appropriate for this server role.'
              opdata: 'Query: {$BIND.DNS.TEST.NAME}/{$BIND.DNS.TEST.TYPE}; UDP state: {ITEM.LASTVALUE}'
              tags:
                - tag: scope
                  value: availability
        - uuid: 8ad961fe0ff74eada45a2db93edbf9e4
          name: 'BIND: DNS TCP availability'
          key: 'net.dns[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},tcp]'
          delay: '{$BIND.DNS.TEST.INTERVAL}'
          history: 30d
          valuemap:
            name: 'BIND service state'
          tags:
            - tag: component
              value: dns
            - tag: scope
              value: availability
          triggers:
            - uuid: 779e5fd8b1ce46c78193b8e32188fdbb
              expression: '{$BIND.DNS.TEST.ENABLED}=1 and max(/ISC BIND by Zabbix agent/net.dns[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},tcp],{$BIND.DNS.FAIL.WINDOW})=0'
              name: 'BIND: DNS functional test failed over TCP'
              event_name: 'BIND: DNS functional test failed over TCP ({$BIND.DNS.TEST.NAME}/{$BIND.DNS.TEST.TYPE})'
              priority: HIGH
              description: 'The configured functional DNS query did not produce a usable TCP answer during the failure window. This does not by itself prove that the BIND daemon is down; verify that the configured test name is appropriate for this server role.'
              opdata: 'Query: {$BIND.DNS.TEST.NAME}/{$BIND.DNS.TEST.TYPE}; TCP state: {ITEM.LASTVALUE}'
              tags:
                - tag: scope
                  value: availability
        - uuid: f1d4b9c8a72e4a66a6f8e7e8d7c6b5a4
          name: 'BIND: DNS UDP availability display'
          type: DEPENDENT
          key: bind.dns.udp.availability.display
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return Number(value) === 1 ? "Up" : "Down";'
          master_item:
            key: 'net.dns[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},udp]'
          tags:
            - tag: component
              value: dns
            - tag: scope
              value: availability
        - uuid: a2e5c0d9b83f4b77b7a9f8f9e8d7c6b5
          name: 'BIND: DNS TCP availability display'
          type: DEPENDENT
          key: bind.dns.tcp.availability.display
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return Number(value) === 1 ? "Up" : "Down";'
          master_item:
            key: 'net.dns[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},tcp]'
          tags:
            - tag: component
              value: dns
            - tag: scope
              value: availability
        - uuid: 99f17316072342ceb59d9f7a81973ee8
          name: 'BIND: DNS UDP response time'
          key: 'net.dns.perf[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},udp]'
          delay: '{$BIND.DNS.TEST.INTERVAL}'
          history: 30d
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: dns
            - tag: scope
              value: performance
          triggers:
            - uuid: d07fbe65e24c4b7db379a05b01b1226f
              expression: '{$BIND.DNS.TEST.ENABLED}=1 and avg(/ISC BIND by Zabbix agent/net.dns.perf[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},udp],5m)>{$BIND.DNS.RESPONSE.UDP.WARN} and min(/ISC BIND by Zabbix agent/net.dns[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},udp],5m)=1'
              name: 'BIND: DNS UDP response time is high'
              event_name: 'BIND: DNS UDP response time is high (over {$BIND.DNS.RESPONSE.UDP.WARN}s for 5m)'
              priority: WARNING
              description: 'The average response time of the local UDP DNS test query has exceeded the configured warning threshold for five minutes.'
              opdata: 'Response time: {ITEM.LASTVALUE}'
              dependencies:
                - name: 'BIND: DNS functional test failed over UDP'
                  expression: '{$BIND.DNS.TEST.ENABLED}=1 and max(/ISC BIND by Zabbix agent/net.dns[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},udp],{$BIND.DNS.FAIL.WINDOW})=0'
              tags:
                - tag: scope
                  value: performance
        - uuid: e92db09808e0414a9068ea00f299fb19
          name: 'BIND: DNS TCP response time'
          key: 'net.dns.perf[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},tcp]'
          delay: '{$BIND.DNS.TEST.INTERVAL}'
          history: 30d
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: dns
            - tag: scope
              value: performance
          triggers:
            - uuid: bdd417fc1d444b97bc30598874b0fba4
              expression: '{$BIND.DNS.TEST.ENABLED}=1 and avg(/ISC BIND by Zabbix agent/net.dns.perf[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},tcp],5m)>{$BIND.DNS.RESPONSE.TCP.WARN} and min(/ISC BIND by Zabbix agent/net.dns[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},tcp],5m)=1'
              name: 'BIND: DNS TCP response time is high'
              event_name: 'BIND: DNS TCP response time is high (over {$BIND.DNS.RESPONSE.TCP.WARN}s for 5m)'
              priority: WARNING
              description: 'The average response time of the local TCP DNS test query has exceeded the configured warning threshold for five minutes.'
              opdata: 'Response time: {ITEM.LASTVALUE}'
              dependencies:
                - name: 'BIND: DNS functional test failed over TCP'
                  expression: '{$BIND.DNS.TEST.ENABLED}=1 and max(/ISC BIND by Zabbix agent/net.dns[{$BIND.DNS.TEST.SERVER},{$BIND.DNS.TEST.NAME},{$BIND.DNS.TEST.TYPE},{$BIND.DNS.TEST.TIMEOUT},{$BIND.DNS.TEST.COUNT},tcp],{$BIND.DNS.FAIL.WINDOW})=0'
              tags:
                - tag: scope
                  value: performance
        - uuid: 443e6db2e27443ea813feab8441acf62
          name: 'BIND: Server statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
          delay: 30s
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw
        - uuid: 70a53c2f16934d3d8bf8fad2f90ce827
          name: 'BIND: Zone statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw
        - uuid: a81c3d9d119a4f23a8890a0000000005
          name: 'BIND: Normalized zone dataset'
          type: DEPENDENT
          key: bind.zones.normalized
          delay: '0'
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var now = Date.parse(d["current-time"]);
                  if (isNaN(now)) {
                      throw "invalid BIND zone current-time";
                  }
                  var out = {"views": {}};
                  Object.keys(d.views || {}).forEach(function (viewName) {
                      var dst = {"zones": {}};
                      (d.views[viewName].zones || []).forEach(function (zone) {
                          if (!zone || !zone.name) {
                              return;
                          }
                          var z = {"type": zone.type || ""};
                          if (zone.serial !== undefined) {
                              z.serial = zone.serial;
                          }
                          if (zone.expires) {
                              var expires = Date.parse(zone.expires);
                              if (!isNaN(expires)) {
                                  z.expires_in = Math.floor((expires - now) / 1000);
                              }
                          }
                          if (zone.refresh) {
                              var refresh = Date.parse(zone.refresh);
                              if (!isNaN(refresh)) {
                                  z.refresh_in = Math.floor((refresh - now) / 1000);
                              }
                          }
                          ["dnssec-sign", "dnssec-refresh"].forEach(function (block) {
                              if (zone[block] && typeof zone[block] === "object") {
                                  z[block] = zone[block];
                              }
                          });
                          dst.zones[zone.name] = z;
                      });
                      out.views[viewName] = dst;
                  });
                  return JSON.stringify(out);
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: internal
        - uuid: 81f8e78c7a0544b787e5c5a12fce5140
          name: 'BIND: Zones total'
          type: DEPENDENT
          key: bind.zones.total
          delay: '0'
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var total = 0;
                  Object.keys(d.views || {}).forEach(function (viewName) {
                      total += (d.views[viewName].zones || []).length;
                  });
                  return total;
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: zones
        - uuid: d4a9bcfd5d644a3193ea481589228d39
          name: 'BIND: Primary zones'
          type: DEPENDENT
          key: bind.zones.primary
          delay: '0'
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var total = 0;
                  Object.keys(d.views || {}).forEach(function (viewName) {
                      (d.views[viewName].zones || []).forEach(function (zone) {
                          if (zone.type === "primary") {
                              total++;
                          }
                      });
                  });
                  return total;
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: zones
        - uuid: 98c3d0c0bd864f3ba8abde4327e806e2
          name: 'BIND: Secondary zones'
          type: DEPENDENT
          key: bind.zones.secondary
          delay: '0'
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var total = 0;
                  Object.keys(d.views || {}).forEach(function (viewName) {
                      (d.views[viewName].zones || []).forEach(function (zone) {
                          if (zone.type === "secondary") {
                              total++;
                          }
                      });
                  });
                  return total;
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: zones
        - uuid: 214c0cd671e24a45bf080beae40be0ea
          name: 'BIND: Memory statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/mem","{$BIND.STATS.PORT}"]'
          delay: 1m
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
