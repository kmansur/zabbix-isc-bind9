                  return JSON.stringify({"data": out});
        - uuid: bfd4ed4351144bfba8783071a037b3f8
          name: 'BIND: Secondary zone timer discovery'
          type: DEPENDENT
          key: bind.zones.secondary.discovery
          delay: '0'
          lifetime: 7d
          filter:
            evaltype: AND
            conditions:
              - macro: '{#BIND.VIEW}'
                value: '{$BIND.VIEW.MATCHES}'
              - macro: '{#BIND.VIEW}'
                value: '{$BIND.VIEW.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#BIND.ZONE}'
                value: '{$BIND.ZONE.SECONDARY.MATCHES}'
          item_prototypes:
            - uuid: bb55051275b6479582cb2c9e57a16742
              name: 'BIND zone [{#BIND.VIEW}] {#BIND.ZONE}: Time until expiry'
              type: DEPENDENT
              key: 'bind.zone.expires.in[{#BIND.VIEW},{#BIND.ZONE}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              units: s
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.views["{#BIND.VIEW}"].zones["{#BIND.ZONE}"].expires_in'
                  error_handler: DISCARD_VALUE
              master_item:
                key: bind.zones.normalized
              tags:
                - tag: component
                  value: zones
                - tag: bind-view
                  value: '{#BIND.VIEW}'
                - tag: bind-zone
                  value: '{#BIND.ZONE}'
              trigger_prototypes:
                - uuid: 5570c281b4a646b58e65a46d0b7f6444
                  expression: 'last(/ISC BIND by Zabbix agent/bind.zone.expires.in[{#BIND.VIEW},{#BIND.ZONE}])<0'
                  name: 'BIND: Secondary zone {#BIND.ZONE} has expired'
                  priority: HIGH
                  description: 'The secondary zone expiry timer is already in the past.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: ef14e21ced6b48169491a33cfa656c72
                  expression: 'last(/ISC BIND by Zabbix agent/bind.zone.expires.in[{#BIND.VIEW},{#BIND.ZONE}])>=0 and last(/ISC BIND by Zabbix agent/bind.zone.expires.in[{#BIND.VIEW},{#BIND.ZONE}])<{$BIND.ZONE.EXPIRES.WARN}'
                  name: 'BIND: Secondary zone {#BIND.ZONE} is approaching expiry'
                  priority: WARNING
                  description: 'The secondary zone is approaching its SOA expiry deadline.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 73601bf5a63349d59239193477c01152
              name: 'BIND zone [{#BIND.VIEW}] {#BIND.ZONE}: Time until refresh'
              type: DEPENDENT
              key: 'bind.zone.refresh.in[{#BIND.VIEW},{#BIND.ZONE}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              units: s
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.views["{#BIND.VIEW}"].zones["{#BIND.ZONE}"].refresh_in'
                  error_handler: DISCARD_VALUE
              master_item:
                key: bind.zones.normalized
              tags:
                - tag: component
                  value: zones
                - tag: bind-view
                  value: '{#BIND.VIEW}'
                - tag: bind-zone
                  value: '{#BIND.ZONE}'
            - uuid: a81c3d9d119a4f23a8890a0000000006
              name: 'BIND zone [{#BIND.VIEW}] {#BIND.ZONE}: Serial'
              type: DEPENDENT
              key: 'bind.zone.serial[{#BIND.VIEW},{#BIND.ZONE}]'
              delay: '0'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.views["{#BIND.VIEW}"].zones["{#BIND.ZONE}"].serial'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: bind.zones.normalized
              tags:
                - tag: component
                  value: zones
                - tag: bind-view
                  value: '{#BIND.VIEW}'
                - tag: bind-zone
                  value: '{#BIND.ZONE}'
          master_item:
            key: bind.zones.normalized
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var out = [];
                  Object.keys(d.views || {}).forEach(function (viewName) {
                      var zones = d.views[viewName].zones || {};
                      Object.keys(zones).forEach(function (zoneName) {
                          var zone = zones[zoneName];
                          if (zone.type === "secondary" &&
                              (zone.expires_in !== undefined || zone.refresh_in !== undefined)) {
                              out.push({
                                  "{#BIND.VIEW}": viewName,
                                  "{#BIND.ZONE}": zoneName
                              });
                          }
                      });
                  });
                  return JSON.stringify({"data": out});
        - uuid: 4ea75d86e363496586dc933dfb7204b3
          name: 'BIND: Zone DNSSEC statistics discovery'
          type: DEPENDENT
          key: bind.zones.dnssec.discovery
          delay: '0'
          lifetime: 7d
          filter:
            evaltype: AND
            conditions:
              - macro: '{#BIND.VIEW}'
                value: '{$BIND.VIEW.MATCHES}'
              - macro: '{#BIND.VIEW}'
                value: '{$BIND.VIEW.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#BIND.ZONE}'
                value: '{$BIND.ZONE.DNSSEC.MATCHES}'
          item_prototypes:
            - uuid: 81a4d946b9b24573b4537f2d06fef837
              name: 'BIND zone [{#BIND.VIEW}] {#BIND.ZONE}: DNSSEC {#BIND.DNSSEC.TYPE} {#BIND.COUNTER} per second'
              type: DEPENDENT
              key: 'bind.zone.dnssec[{#BIND.VIEW},{#BIND.ZONE},{#BIND.DNSSEC.TYPE},{#BIND.COUNTER}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.views["{#BIND.VIEW}"].zones["{#BIND.ZONE}"]["{#BIND.DNSSEC.TYPE}"]["{#BIND.COUNTER}"]'
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              master_item:
                key: bind.zones.normalized
              tags:
                - tag: component
                  value: dnssec
                - tag: bind-view
                  value: '{#BIND.VIEW}'
                - tag: bind-zone
                  value: '{#BIND.ZONE}'
          master_item:
            key: bind.zones.normalized
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var out = [];
                  var blocks = ["dnssec-sign", "dnssec-refresh"];
                  Object.keys(d.views || {}).forEach(function (viewName) {
                      var zones = d.views[viewName].zones || {};
                      Object.keys(zones).forEach(function (zoneName) {
                          var zone = zones[zoneName] || {};
                          blocks.forEach(function (blockName) {
                              var counters = zone[blockName];
                              if (!counters) {
                                  return;
                              }
                              Object.keys(counters).forEach(function (counter) {
                                  out.push({
                                      "{#BIND.VIEW}": viewName,
                                      "{#BIND.ZONE}": zoneName,
                                      "{#BIND.DNSSEC.TYPE}": blockName,
                                      "{#BIND.COUNTER}": counter
                                  });
                              });
                          });
                      });
                  });
                  return JSON.stringify({"data": out});
