              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw
        - uuid: 7bf26f3d319a4e9e841301d8847c5006
          name: 'BIND: Network statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/net","{$BIND.STATS.PORT}"]'
          delay: 1m
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw
        - uuid: 3f658d65668d46479ff0e8bbbd4fec2c
          name: 'BIND: Traffic statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/traffic","{$BIND.STATS.PORT}"]'
          delay: 1m
