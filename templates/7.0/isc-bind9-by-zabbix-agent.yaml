      discovery_rules:
        - uuid: c8766ef323e8404c9416e47091af90f7
          name: 'BIND: nsstats counter discovery'
          type: DEPENDENT
          key: bind.nsstats.discovery
          delay: '0'
          lifetime: 7d
          item_prototypes:
            - uuid: 068d1638f0e74ef0aaea4a9a92a7e95a
              name: 'BIND nsstats: {#BIND.COUNTER} per second'
              type: DEPENDENT
              key: 'bind.nsstats[{#BIND.COUNTER}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              units: qps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.nsstats["{#BIND.COUNTER}"]'
                  error_handler: DISCARD_VALUE
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              master_item:
                key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
              tags:
                - tag: component
                  value: nsstats
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var counters = d.nsstats || {};
                  var skip = {
                      Requestv4: true,
                      Requestv6: true,
                      QryDropped: true,
                      QrySERVFAIL: true,
                      QryRecursion: true,
                      RecursClients: true,
                      TCPConnHighWater: true,
                      RecursHighwater: true
                  };
                  var out = [];
                  Object.keys(counters).forEach(function (name) {
                      if (!skip[name]) {
                          out.push({"{#BIND.COUNTER}": name});
                      }
                  });
                  return JSON.stringify({"data": out});
        - uuid: 4bda5d7e6c0c470f944c7ed815621aaa
          name: 'BIND: nsstats gauge discovery'
          type: DEPENDENT
          key: bind.nsstats.gauge.discovery
          delay: '0'
          lifetime: 7d
          item_prototypes:
            - uuid: 9d3e70d4a70d46f3910d3bbf41ca0214
              name: 'BIND nsstats gauge: {#BIND.COUNTER}'
              type: DEPENDENT
              key: 'bind.nsstats.gauge[{#BIND.COUNTER}]'
              delay: '0'
              history: 30d
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.nsstats["{#BIND.COUNTER}"]'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              master_item:
                key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
              tags:
                - tag: component
                  value: nsstats
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var counters = d.nsstats || {};
                  var gauges = {
                      TCPConnHighWater: true,
                      RecursHighwater: true
                  };
                  var out = [];
                  Object.keys(counters).forEach(function (name) {
                      if (gauges[name]) {
                          out.push({"{#BIND.COUNTER}": name});
                      }
                  });
                  return JSON.stringify({"data": out});

