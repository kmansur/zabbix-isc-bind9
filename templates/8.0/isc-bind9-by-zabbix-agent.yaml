                  value: '{#BIND.ZONE}'
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var views = d.views || {};
                  var out = [];
                  var blocks = ["dnssec-sign", "dnssec-refresh"];
                  Object.keys(views).forEach(function (viewName) {
                      var zones = views[viewName].zones || [];
                      zones.forEach(function (zone) {
                          blocks.forEach(function (blockName) {
                              var counters = zone ? zone[blockName] : null;
                              if (!counters) {
                                  return;
                              }
                              Object.keys(counters).forEach(function (counter) {
                                  out.push({
                                      "{#BIND.VIEW}": viewName,
                                      "{#BIND.ZONE}": zone.name,
                                      "{#BIND.DNSSEC.TYPE}": blockName,
                                      "{#BIND.COUNTER}": counter
                                  });
                              });
                          });
                      });
                  });
                  return JSON.stringify({"data": out});
