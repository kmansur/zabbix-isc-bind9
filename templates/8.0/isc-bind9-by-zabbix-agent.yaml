        - uuid: ae96a666465249b7846ee3ad20e69b04
          name: 'BIND: TCP responses per second'
          type: DEPENDENT
          key: bind.traffic.tcp.responses
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: qps
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var t = d.traffic || {};
                  function sum(o) {
                      var total = 0;
                      Object.keys(o || {}).forEach(function (k) { total += Number(o[k]) || 0; });
                      return total;
                  }
                  return sum(t["dns-tcp-responses-sizes-sent-ipv4"]) +
                         sum(t["dns-tcp-responses-sizes-sent-ipv6"]);
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/traffic","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: traffic
