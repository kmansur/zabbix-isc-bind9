        - uuid: 4ea75d86e363496586dc933dfb7204b3
          name: 'BIND: Zone DNSSEC statistics discovery'
          type: DEPENDENT
          key: bind.zones.dnssec.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#BIND.ZONE}'
                value: '{$BIND.ZONE.DNSSEC.MATCHES}'
          item_prototypes:
            - uuid: 81a4d946b9b24573b4537f2d06fef837
              name: 'BIND zone [{#BIND.VIEW}] {#BIND.ZONE}: DNSSEC {#BIND.DNSSEC.TYPE} {#BIND.COUNTER} per second'
              type: DEPENDENT
              key: 'bind.zone.dnssec[{#BIND.VIEW},{#BIND.ZONE},{#BIND.DNSSEC.TYPE},{#BIND.COUNTER}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var view = "{#BIND.VIEW}";
                      var name = "{#BIND.ZONE}";
                      var blockName = "{#BIND.DNSSEC.TYPE}";
                      var counter = "{#BIND.COUNTER}";
                      var zones = d.views && d.views[view] ? d.views[view].zones : null;
                      if (!zones) {
                          throw "BIND view not found";
                      }
                      for (var i = 0; i < zones.length; i++) {
                          if (zones[i].name === name) {
                              var block = zones[i][blockName];
                              if (block && block[counter] !== undefined) {
                                  return block[counter];
                              }
                          }
                      }
                      throw "DNSSEC zone counter not available";
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 30m
              master_item:
                key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
