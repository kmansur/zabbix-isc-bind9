zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 09692d9c015440aab7aa667a9639ebc8
      name: Templates/Applications
  templates:
    - uuid: e381e5bdc51445fd9bbe1b1e8ea1eb0d
      template: 'ISC BIND 9 by Zabbix Agent'
      name: 'ISC BIND 9 by Zabbix Agent'
      description: |
        Security-focused monitoring of ISC BIND 9 through the native HTTP statistics channel.

        Compatible with Zabbix Agent and Zabbix Agent 2. The template intentionally uses standard passive agent checks and
        standard agent keys and does not require Agent 2 plugins, UserParameter, privileged
        commands, rndc, curl, jq, or external scripts.

        Recommended statistics listener:
        statistics-channels {
            inet 127.0.0.1 port 8053 allow { 127.0.0.1; };
        };

        Project: https://github.com/kmansur/zabbix-isc-bind9
        License: MIT. See LICENSE and NOTICE.md.
        Export target: Zabbix 8.0 compatibility candidate.
      vendor:
        name: Net Tech
        version: 0.1-2
      groups:
        - name: Templates/Applications
      items:
        - uuid: fc1ced7cb7114269b89a8e99c52cffc9
          name: 'BIND: Statistics status raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/status","{$BIND.STATS.PORT}"]'
          delay: 30s
          history: 1h
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: d48429e64c854d9b99cfb8aaba9fee7e
              expression: 'nodata(/ISC BIND 9 by Zabbix Agent/web.page.get["{$BIND.STATS.HOST}","/json/v1/status","{$BIND.STATS.PORT}"],{$BIND.STATS.NODATA})=1'
              name: 'BIND: Statistics channel is unavailable'
              priority: HIGH
              description: 'No data has been received from the local BIND statistics channel within the configured interval.'
        - uuid: 443e6db2e27443ea813feab8441acf62
          name: 'BIND: Server statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
          delay: 30s
          history: 1h
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw
        - uuid: 70a53c2f16934d3d8bf8fad2f90ce827
          name: 'BIND: Zone statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
          delay: 5m
          history: 1h
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw
        - uuid: 81f8e78c7a0544b787e5c5a12fce5140
          name: 'BIND: Zones total'
          type: DEPENDENT
          key: bind.zones.total
          delay: '0'
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var total = 0;
                  Object.keys(d.views || {}).forEach(function (viewName) {
                      total += (d.views[viewName].zones || []).length;
                  });
                  return total;
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: zones
        - uuid: d4a9bcfd5d644a3193ea481589228d39
          name: 'BIND: Primary zones'
          type: DEPENDENT
          key: bind.zones.primary
          delay: '0'
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var total = 0;
                  Object.keys(d.views || {}).forEach(function (viewName) {
                      (d.views[viewName].zones || []).forEach(function (zone) {
                          if (zone.type === "primary") {
                              total++;
                          }
                      });
                  });
                  return total;
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: zones
        - uuid: 98c3d0c0bd864f3ba8abde4327e806e2
          name: 'BIND: Secondary zones'
          type: DEPENDENT
          key: bind.zones.secondary
          delay: '0'
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var total = 0;
                  Object.keys(d.views || {}).forEach(function (viewName) {
                      (d.views[viewName].zones || []).forEach(function (zone) {
                          if (zone.type === "secondary") {
                              total++;
                          }
                      });
                  });
                  return total;
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: zones
        - uuid: 214c0cd671e24a45bf080beae40be0ea
          name: 'BIND: Memory statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/mem","{$BIND.STATS.PORT}"]'
          delay: 1m
          history: 1h
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw
        - uuid: 7bf26f3d319a4e9e841301d8847c5006
          name: 'BIND: Network statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/net","{$BIND.STATS.PORT}"]'
          delay: 1m
          history: 1h
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw
        - uuid: 3f658d65668d46479ff0e8bbbd4fec2c
          name: 'BIND: Traffic statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/traffic","{$BIND.STATS.PORT}"]'
          delay: 1m
          history: 1h
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?s)({.*)'
                - \1
          tags:
            - tag: component
              value: raw

        - uuid: 905c6f9e3b7741e493ab3f2feb2e3b51
          name: 'BIND: Transfer statistics raw'
          key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/xfrins","{$BIND.STATS.PORT}"]'
          delay: 1m
          history: 1h
          value_type: TEXT
          trends: '0'
          tags:
            - tag: component
              value: raw
        - uuid: 200af6140c9449f8b4dfaedceba2511e
          name: 'BIND: Transfer statistics endpoint supported'
          type: DEPENDENT
          key: bind.xfrins.supported
          delay: '0'
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  if (!/^HTTP\/\d(?:\.\d)?\s+200\b/m.test(value)) {
                      return 0;
                  }
                  var p = value.indexOf("{");
                  if (p < 0) {
                      return 0;
                  }
                  try {
                      var d = JSON.parse(value.substring(p));
                      return d.views !== undefined ? 1 : 0;
                  } catch (e) {
                      return 0;
                  }
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/xfrins","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: transfers
        - uuid: 3bd77fd257554daf98aa80d60119fb5d
          name: 'BIND: Incoming transfers active or queued'
          type: DEPENDENT
          key: bind.xfrins.count
          delay: '0'
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var p = value.indexOf("{");
                  if (p < 0) {
                      return 0;
                  }
                  try {
                      var d = JSON.parse(value.substring(p));
                      var total = 0;
                      Object.keys(d.views || {}).forEach(function (viewName) {
                          total += (d.views[viewName].xfrins || []).length;
                      });
                      return total;
                  } catch (e) {
                      return 0;
                  }
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/xfrins","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: transfers
        - uuid: c1b03b7f206c44e9907dfc439d125e07
          name: 'BIND: Incoming transfers deferred'
          type: DEPENDENT
          key: bind.xfrins.deferred
          delay: '0'
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var p = value.indexOf("{");
                  if (p < 0) {
                      return 0;
                  }
                  try {
                      var d = JSON.parse(value.substring(p));
                      var total = 0;
                      Object.keys(d.views || {}).forEach(function (viewName) {
                          (d.views[viewName].xfrins || []).forEach(function (xfr) {
                              if (xfr.state === "Deferred") {
                                  total++;
                              }
                          });
                      });
                      return total;
                  } catch (e) {
                      return 0;
                  }
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/xfrins","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: transfers
          triggers:
            - uuid: 52e06f77bf45497cbf7dc9ae6feb4900
              expression: 'min(/ISC BIND 9 by Zabbix Agent/bind.xfrins.deferred,5m)>0'
              name: 'BIND: Incoming zone transfer has remained deferred'
              priority: WARNING
              description: 'At least one incoming zone transfer has remained in Deferred state for five minutes.'
        - uuid: 8b491d2b6a9d4108b4b494b1f2aaa92c
          name: 'BIND: Incoming transfer bytes'
          type: DEPENDENT
          key: bind.xfrins.bytes
          delay: '0'
          history: 30d
          units: B
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var p = value.indexOf("{");
                  if (p < 0) {
                      return 0;
                  }
                  try {
                      var d = JSON.parse(value.substring(p));
                      var total = 0;
                      Object.keys(d.views || {}).forEach(function (viewName) {
                          (d.views[viewName].xfrins || []).forEach(function (xfr) {
                              total += Number(xfr.nbytes) || 0;
                          });
                      });
                      return total;
                  } catch (e) {
                      return 0;
                  }
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/xfrins","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: transfers
        - uuid: 93e81ad52ab047b980e82d715769b6f5
          name: 'BIND: Incoming transfer aggregate rate'
          type: DEPENDENT
          key: bind.xfrins.rate
          delay: '0'
          history: 30d
          units: Bps
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var p = value.indexOf("{");
                  if (p < 0) {
                      return 0;
                  }
                  try {
                      var d = JSON.parse(value.substring(p));
                      var total = 0;
                      Object.keys(d.views || {}).forEach(function (viewName) {
                          (d.views[viewName].xfrins || []).forEach(function (xfr) {
                              total += Number(xfr.rate) || 0;
                          });
                      });
                      return total;
                  } catch (e) {
                      return 0;
                  }
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/xfrins","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: transfers
        - uuid: 04698aed05a34db58380afe9e45b3b53
          name: 'BIND: Memory in use'
          type: DEPENDENT
          key: bind.memory.inuse
          delay: '0'
          history: 30d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.memory.InUse
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/mem","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: memory
        - uuid: 3fdc07e53a9641f690d2e6fcfe23e198
          name: 'BIND: Memory malloced'
          type: DEPENDENT
          key: bind.memory.malloced
          delay: '0'
          history: 30d
          units: B
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.memory.Malloced
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/mem","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: memory
        - uuid: a2d9d517819247d4b75369265b986254
          name: 'BIND: Memory contexts'
          type: DEPENDENT
          key: bind.memory.contexts
          delay: '0'
          history: 30d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var contexts = d.memory && d.memory.contexts ? d.memory.contexts : [];
                  return contexts.length;
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/mem","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: memory
        - uuid: 3df51309864147dc93c9ffe338cfb77d
          name: 'BIND: Version'
          type: DEPENDENT
          key: bind.version
          delay: '0'
          history: 30d
          trends: '0'
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.version
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/status","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: identification
        - uuid: fc05edeaac914f63aa7daa458214fe97
          name: 'BIND: JSON statistics version'
          type: DEPENDENT
          key: bind.stats.json.version
          delay: '0'
          history: 30d
          trends: '0'
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$["json-stats-version"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/status","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: identification
        - uuid: bea3129156a443ad88ad493ab3ae1db8
          name: 'BIND: Uptime'
          type: DEPENDENT
          key: bind.uptime
          delay: '0'
          history: 30d
          units: uptime
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var now = Date.parse(d["current-time"]);
                  var boot = Date.parse(d["boot-time"]);
                  if (isNaN(now) || isNaN(boot)) {
                      throw "invalid BIND status timestamps";
                  }
                  return Math.max(0, Math.floor((now - boot) / 1000));
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/status","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: status
        - uuid: cf7d83b36e1749e58177e08dc4d8c95c
          name: 'BIND: Time since last configuration'
          type: DEPENDENT
          key: bind.config.age
          delay: '0'
          history: 30d
          units: uptime
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var now = Date.parse(d["current-time"]);
                  var configured = Date.parse(d["config-time"]);
                  if (isNaN(now) || isNaN(configured)) {
                      throw "invalid BIND configuration timestamp";
                  }
                  return Math.max(0, Math.floor((now - configured) / 1000));
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/status","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: status
        - uuid: 9c8cc662d17c48af84d668e5a220f861
          name: 'BIND: IPv4 requests per second'
          type: DEPENDENT
          key: bind.nsstats.requestv4
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: qps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nsstats.Requestv4
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: queries
        - uuid: 6c6eabf6b71c4010b8fa88b4375a9f8c
          name: 'BIND: IPv6 requests per second'
          type: DEPENDENT
          key: bind.nsstats.requestv6
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: qps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nsstats.Requestv6
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: queries
        - uuid: 7cfa575242074c178d27c57638338898
          name: 'BIND: Dropped queries per second'
          type: DEPENDENT
          key: bind.nsstats.qrydropped
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: qps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nsstats.QryDropped
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: queries
          triggers:
            - uuid: 6c5c2dacc0034be1801f0ae5553401d0
              expression: 'avg(/ISC BIND 9 by Zabbix Agent/bind.nsstats.qrydropped,5m)>{$BIND.QRYDROPPED.RATE.WARN}'
              name: 'BIND: Dropped queries detected'
              priority: HIGH
              opdata: '{ITEM.LASTVALUE}'
        - uuid: c632d2c537614f3880838114a8eb39e9
          name: 'BIND: SERVFAIL responses per second'
          type: DEPENDENT
          key: bind.nsstats.servfail
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: qps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nsstats.QrySERVFAIL
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: queries
          triggers:
            - uuid: c93045208f9847c4a1a503aa4b75a7aa
              expression: 'avg(/ISC BIND 9 by Zabbix Agent/bind.nsstats.servfail,5m)>{$BIND.SERVFAIL.RATE.WARN}'
              name: 'BIND: High SERVFAIL response rate'
              priority: HIGH
              opdata: '{ITEM.LASTVALUE}'
        - uuid: 42b093ecf0bc4738a4079a2b31a71178
          name: 'BIND: Recursive queries per second'
          type: DEPENDENT
          key: bind.nsstats.recursion
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: qps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nsstats.QryRecursion
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/server","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: resolver
        - uuid: b1f3d20f869d46ce8d2d7c6bbd1bf3d6
          name: 'BIND: UDP requests per second'
          type: DEPENDENT
          key: bind.traffic.udp.requests
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: qps
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var t = d.traffic || {};
                  function sum(o) {
                      var total = 0;
                      Object.keys(o || {}).forEach(function (k) { total += Number(o[k]) || 0; });
                      return total;
                  }
                  return sum(t["dns-udp-requests-sizes-received-ipv4"]) +
                         sum(t["dns-udp-requests-sizes-received-ipv6"]);
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/traffic","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: traffic
        - uuid: bc9a05e835d8436b8e6020fc62972549
          name: 'BIND: TCP requests per second'
          type: DEPENDENT
          key: bind.traffic.tcp.requests
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: qps
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var t = d.traffic || {};
                  function sum(o) {
                      var total = 0;
                      Object.keys(o || {}).forEach(function (k) { total += Number(o[k]) || 0; });
                      return total;
                  }
                  return sum(t["dns-tcp-requests-sizes-received-ipv4"]) +
                         sum(t["dns-tcp-requests-sizes-received-ipv6"]);
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/traffic","{$BIND.STATS.PORT}"]'
          tags:
            - tag: component
              value: traffic
        - uuid: c4e14c3f227b4d1eadd32845e8c52e63
          name: 'BIND: UDP responses per second'
          type: DEPENDENT
          key: bind.traffic.udp.responses
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: qps
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  var t = d.traffic || {};
                  function sum(o) {
                      var total = 0;
                      Object.keys(o || {}).forEach(function (k) { total += Number(o[k]) || 0; });
                      return total;
                  }
                  return sum(t["dns-udp-responses-sizes-sent-ipv4"]) +
                         sum(t["dns-udp-responses-sizes-sent-ipv6"]);
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
