        - uuid: bfd4ed4351144bfba8783071a037b3f8
          name: 'BIND: Secondary zone timer discovery'
          type: DEPENDENT
          key: bind.zones.secondary.discovery
          delay: '0'
          item_prototypes:
            - uuid: bb55051275b6479582cb2c9e57a16742
              name: 'BIND zone [{#BIND.VIEW}] {#BIND.ZONE}: Time until expiry'
              type: DEPENDENT
              key: 'bind.zone.expires.in[{#BIND.VIEW},{#BIND.ZONE}]'
              delay: '0'
              history: 30d
              units: s
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var view = "{#BIND.VIEW}";
                      var name = "{#BIND.ZONE}";
                      var now = Date.parse(d["current-time"]);
                      var zones = d.views && d.views[view] ? d.views[view].zones : null;
                      if (!zones || isNaN(now)) {
                          throw "BIND zone timing data not available";
                      }
                      for (var i = 0; i < zones.length; i++) {
                          if (zones[i].name === name && zones[i].expires) {
                              var expires = Date.parse(zones[i].expires);
                              if (isNaN(expires)) {
                                  throw "invalid zone expiry timestamp";
                              }
                              return Math.floor((expires - now) / 1000);
                          }
                      }
                      throw "zone expiry timestamp not available";
              master_item:
                key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
              tags:
                - tag: component
                  value: zones
                - tag: bind-view
                  value: '{#BIND.VIEW}'
                - tag: bind-zone
                  value: '{#BIND.ZONE}'
              trigger_prototypes:
                - uuid: 5570c281b4a646b58e65a46d0b7f6444
                  expression: 'last(/ISC BIND 9 by Zabbix Agent/bind.zone.expires.in[{#BIND.VIEW},{#BIND.ZONE}])<0'
                  name: 'BIND: Secondary zone {#BIND.ZONE} has expired'
                  priority: HIGH
                  description: 'The secondary zone expiry timer is already in the past.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: ef14e21ced6b48169491a33cfa656c72
                  expression: 'last(/ISC BIND 9 by Zabbix Agent/bind.zone.expires.in[{#BIND.VIEW},{#BIND.ZONE}])>=0 and last(/ISC BIND 9 by Zabbix Agent/bind.zone.expires.in[{#BIND.VIEW},{#BIND.ZONE}])<{$BIND.ZONE.EXPIRES.WARN}'
                  name: 'BIND: Secondary zone {#BIND.ZONE} is approaching expiry'
                  priority: WARNING
                  description: 'The secondary zone is approaching its SOA expiry deadline.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 73601bf5a63349d59239193477c01152
              name: 'BIND zone [{#BIND.VIEW}] {#BIND.ZONE}: Time until refresh'
              type: DEPENDENT
              key: 'bind.zone.refresh.in[{#BIND.VIEW},{#BIND.ZONE}]'
              delay: '0'
              history: 30d
              units: s
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value);
                      var view = "{#BIND.VIEW}";
                      var name = "{#BIND.ZONE}";
                      var now = Date.parse(d["current-time"]);
                      var zones = d.views && d.views[view] ? d.views[view].zones : null;
                      if (!zones || isNaN(now)) {
                          throw "BIND zone timing data not available";
                      }
                      for (var i = 0; i < zones.length; i++) {
                          if (zones[i].name === name && zones[i].refresh) {
                              var refresh = Date.parse(zones[i].refresh);
                              if (isNaN(refresh)) {
                                  throw "invalid zone refresh timestamp";
                              }
                              return Math.floor((refresh - now) / 1000);
                          }
                      }
                      throw "zone refresh timestamp not available";
              master_item:
                key: 'web.page.get["{$BIND.STATS.HOST}","/json/v1/zones","{$BIND.STATS.PORT}"]'
